name: Verify Reflex Forge

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser-and-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit, deterministic engine, and production build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile and desktop acceptance
        run: npm run test:e2e
